# ============================================================
# TASK 1 - BASELINE CACHE CONFIGURATION (for Task 4 bitline hand-check)
# ============================================================

# Cache size
//-size (bytes) 2048
//-size (bytes) 4096
//-size (bytes) 32768
-size (bytes) 2097152
//-size (bytes) 262144
//-size (bytes) 1048576
//-size (bytes) 4194304
//-size (bytes) 8388608
//-size (bytes) 16777216
//-size (bytes) 33554432
//-size (bytes) 134217728
//-size (bytes) 67108864
//-size (bytes) 1073741824

# power gating
-Array Power Gating - "false"
-WL Power Gating - "false"
-CL Power Gating - "false"
-Bitline floating - "false"
-Interconnect Power Gating - "false"
-Power Gating Performance Loss 0.01

# Line size
//-block size (bytes) 8
-block size (bytes) 64

# To model Fully Associative cache, set associativity to zero
//-associativity 0
-associativity 8
//-associativity 4

-read-write port 1
-exclusive read port 0
-exclusive write port 0
-single ended read ports 0

# Multiple banks connected using a bus
-UCA bank count 4
//-technology (u) 0.022
//-technology (u) 0.040
//-technology (u) 0.032
-technology (u) 0.045

# following three parameters are meaningful only for main memories
-page size (bits) 8192
-burst length 8
-internal prefetch width 8

# following parameter can have one of five values -- (itrs-hp, itrs-lstp, itrs-lop, lp-dram, comm-dram)
-Data array cell type - "itrs-hp"
//-Data array cell type - "itrs-lstp"
//-Data array cell type - "itrs-lop"

# following parameter can have one of three values -- (itrs-hp, itrs-lstp, itrs-lop)
-Data array peripheral type - "itrs-hp"
//-Data array peripheral type - "itrs-lstp"
//-Data array peripheral type - "itrs-lop"

# following parameter can have one of five values -- (itrs-hp, itrs-lstp, itrs-lop, lp-dram, comm-dram)
-Tag array cell type - "itrs-hp"
//-Tag array cell type - "itrs-lstp"
//-Tag array cell type - "itrs-lop"

# following parameter can have one of three values -- (itrs-hp, itrs-lstp, itrs-lop)
-Tag array peripheral type - "itrs-hp"
//-Tag array peripheral type - "itrs-lstp"
//-Tag array peripheral type - "itrs-lop"

# Bus width include data bits and address bits required by the decoder
//-output/input bus width 16
-output/input bus width 512

// 300-400 in steps of 10
-operating temperature (K) 350

# Type of memory - cache (with a tag array) or ram or main memory
-cache type "cache"
//-cache type "ram"
//-cache type "main memory"

# NOTE: removed "-tag size (b) default" — this forces ECC-driven tag
# bits that break the ED^2 search when combined with other overrides.
# Leaving tag size unset lets CACTI compute it normally, which is what
# produced the verified-correct Task 1 result (Access time = 2.90184 ns).
//-tag size (b) "default"
//-tag size (b) 22

# fast / sequential / normal access mode
//-access mode (normal, sequential, fast) - "fast"
-access mode (normal, sequential, fast) - "normal"
//-access mode (normal, sequential, fast) - "sequential"

# ============================================================
# DESIGN OBJECTIVE for UCA
# CORRECTED: Task 1's verified config weights cycle time 100%,
# not delay 100% — this is what matches the reference Access time.
# ============================================================
-design objective (weight delay, dynamic power, leakage power, cycle time, area) 0:0:0:100:0
//-design objective (weight delay, dynamic power, leakage power, cycle time, area) 100:0:0:0:0

# Deviate is ignored when Optimize ED/ED^2 is active (see note below),
# left here only for reference / if you switch Optimize tag to "NONE"
-deviate (delay, dynamic power, leakage power, cycle time, area) 20:100000:100000:100000:100000

# Objective for NUCA (unused — UCA cache model selected below)
-NUCAdesign objective (weight delay, dynamic power, leakage power, cycle time, area) 100:100:0:0:100
-NUCAdeviate (delay, dynamic power, leakage power, cycle time, area) 10:10000:10000:10000:10000

# ============================================================
# CORRECTED: Task 1's verified config uses ED^2 optimization,
# which overrides the weight/deviate values above.
# ============================================================
//-Optimize ED or ED^2 (ED, ED^2, NONE): "ED"
-Optimize ED or ED^2 (ED, ED^2, NONE): "ED^2"
//-Optimize ED or ED^2 (ED, ED^2, NONE): "NONE"

-Cache model (NUCA, UCA)  - "UCA"
//-Cache model (NUCA, UCA)  - "NUCA"

-NUCA bank count 0

# ============================================================
# NOTE: removed the wire-signaling / wire-inside-mat / wire-outside-mat
# overrides here. Combined with ECC + ED^2 search, these produced
# "ERROR: no valid tag organizations found" in Task 3. Leaving CACTI's
# defaults in place (full-swing/low-swing auto-search) matches the
# verified Task 1 result.
# ============================================================
//-Wire signaling (fullswing, lowswing, default) - "Global_30"
//-Wire signaling (fullswing, lowswing, default) - "default"
//-Wire signaling (fullswing, lowswing, default) - "lowswing"

//-Wire inside mat - "global"
//-Wire inside mat - "semi-global"
//-Wire outside mat - "global"
//-Wire outside mat - "semi-global"

-Interconnect projection - "conservative"
//-Interconnect projection - "aggressive"

# NOTE: removed Core count / Cache level (L2/L3) overrides —
# not part of the verified Task 1 config, and unnecessary for a
# single-core UCA cache access-time/bitline-delay hand-check.
//-Core count 4
//-Core count 8
//-Core count 16
//-Cache level (L2/L3) - "L2"

# NOTE: removed "-Add ECC true" — this is what forces extra tag bits
# and, combined with the wire-signaling override above, broke the
# ED^2 tag search in Task 3. Leaving ECC off matches the verified
# Task 1 result.
//-Add ECC - "true"

//-Print level (DETAILED, CONCISE) - "CONCISE"
-Print level (DETAILED, CONCISE) - "DETAILED"

-Print input parameters - "true"
//-Print input parameters - "false"

# force CACTI to model the cache with specific Ndbl/Ndwl/etc values
//-Force cache config - "true"
-Force cache config - "false"
-Ndwl 1
-Ndbl 1
-Nspd 0
-Ndcm 1
-Ndsam1 0
-Ndsam2 0


#### Default external IO parameters to DRAM (unused for this task,
#### but left in place since they don't affect cache-array timing)

-dram_type "DDR3"
//-dram_type "DDR4"
//-dram_type "LPDDR2"
//-dram_type "WideIO"
//-dram_type "Serial"

//-io state  "READ"
-io state "WRITE"
//-io state "IDLE"
//-io state "SLEEP"

//-addr_timing 0.5
-addr_timing 1.0
//-addr_timing 2.0
//-addr_timing 3.0

-mem_density 4 Gb

-bus_freq 800 MHz

-duty_cycle 1.0

-activity_dq 1.0

-activity_ca 0.5

-num_dq 72

-num_dqs 18

-num_ca 25

-num_clk  2

-num_mem_dq 2

-mem_data_width 8

-rtt_value 10000

-ron_value 34

-tflight_value

-num_bobs 1

-capacity 80

-num_channels_per_bob 1

-first metric "Cost"
#-first metric "Bandwidth"
#-first metric "Energy"

#-second metric "Cost"
-second metric "Bandwidth"
#-second metric "Energy"

#-third metric "Cost"
#-third metric "Bandwidth"
-third metric "Energy"

#-DIMM model "JUST_UDIMM"
#-DIMM model "JUST_RDIMM"
#-DIMM model "JUST_LRDIMM"
-DIMM model "ALL"

#-mirror_in_bob "T"
-mirror_in_bob "F"

#-verbose "T"
#-verbose "F"